[package]
name = "pfhash-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings (PyO3) for pfhash-rs."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pfhash = { path = "../pfhash-rs" }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
numpy = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
