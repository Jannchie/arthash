[package]
name = "arthash-py"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Python bindings (PyO3) for arthash-rs."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arthash = { path = "../arthash-rs" }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
numpy = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
