[package]
name = "pfhash-wasm"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "wasm-bindgen wrapper around pfhash-rs for the @pfhash/ts package."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pfhash = { path = "../../pfhash-rs" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
