[package]
name = "arthash-wasm"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "wasm-bindgen wrapper around arthash-rs for the arthash package."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arthash = { path = "../../arthash-rs" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
# opt-level = 3 prioritises speed over size. arthash wasm stays well under
# 100 KB gzipped either way, but DCT encode/decode runs ~3× faster than
# under "z". Switch back to "s"/"z" if binary size becomes a problem.
opt-level = 3
lto = true
codegen-units = 1
