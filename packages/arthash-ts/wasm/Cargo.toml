[package]
name = "arthash-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm-bindgen wrapper around arthash-rs for the arthash package."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arthash = { path = "../../arthash-rs" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
