[package]
name = "pfhash"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Placeholder-image hash family — Rust SDK"
publish = false

[lib]
name = "pfhash"
crate-type = ["rlib"]

[features]
default = []
# Bundles the `image` crate so callers can pass a file path / DynamicImage
# instead of pre-resized raw RGB bytes. Off by default to keep the core
# crate dependency-free.
image-io = ["dep:image"]
# Enables thread-local counters in shape::raster (per-eval-call,
# per-pixel-touched). Used by examples/bench_hillclimb.rs to attribute
# hill-climb cost; zero-cost when off.
bench-counters = []

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = [
    "png", "jpeg",
] }
matrixmultiply = "0.3"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
