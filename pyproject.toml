# arthash workspace root.
#
# This file declares the uv workspace and shared dev/research dependency
# groups. The actual arthash package lives at packages/arthash-py/. To
# develop on the package:
#
#     uv sync --all-extras --group dev --group research
#     uv run pytest packages/arthash-py/tests/
#
# pnpm-workspace.yaml in this directory governs the JS / TS / Rust packages
# under packages/; uv governs the Python packages.

[project]
name = "arthash-workspace"
version = "0.4.0"
description = "Workspace root for the arthash monorepo. Not a published package."
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/arthash-py", "packages/arthash-research"]

[tool.uv.sources]
# `thash` is resolved from PyPI (published thumbhash-py). It used to be
# overridden to an editable `../thumbhash-py` sibling checkout for co-dev, but
# that made `uv sync`/`uv run` fail anywhere the sibling is absent (CI). The
# published release exposes the same API arthash-research's baselines use, so
# no local checkout is needed. To co-develop thumbhash-py locally, re-add:
#   thash = { path = "../thumbhash-py", editable = true }
arthash = { workspace = true }
arthash-research = { workspace = true }

[dependency-groups]
# Default group: just the package-under-test + its lint/test tools. Kept
# deliberately lean so `uv sync` (and CI) never needs the `thash` sibling
# checkout or the heavy science stack — those live in `research` below.
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "arthash",
]
# Opt-in group for the ablation / benchmark scripts. Pulls in arthash-research
# → thash (../thumbhash-py) + scikit-image/numba/pandas/scipy. Requires the
# sibling thumbhash-py checkout, so it is NOT synced by default:
#     uv sync --group research
research = [
  "arthash-research",
]

[tool.ruff]
line-length = 120
extend-exclude = ["dist", ".venv", "packages/*/dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E741",
  "UP006",
  "UP035",
  # ShapeType / Preset deliberately use the `(str, Enum)` mixin (not 3.11+
  # `StrEnum`): they are FFI/wire enums and StrEnum changes `str()` / format
  # semantics across the language boundary.
  "UP042",
  # Documentation deliberately uses real typographic Unicode — `×` for image
  # dimensions (48×48), `–` (en dash) for ranges, `σ` for blur sigma. These
  # are correct, not homoglyph mistakes.
  "RUF001", # ambiguous char in string
  "RUF002", # ambiguous char in docstring
  "RUF003", # ambiguous char in comment
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
