name: python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/arthash-py/**"
      - "packages/arthash-rs/**"
      - ".github/workflows/wheels.yml"

jobs:
  # ------------------------------------------------------------------
  # version sanity: on a release tag (push:tags = v*), every manifest
  # MUST agree with VERSION and with the tag. arthash uses fixed-version
  # across all SDKs (RELEASING.md); the script reads all seven sites.
  # PRs and workflow_dispatch skip this — drift only matters at publish.
  # ------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"

  # ------------------------------------------------------------------
  # wheels: one wheel per OS×arch. abi3-py39 means a single wheel covers
  # CPython 3.11+ (the floor in pyproject.toml), so no Python matrix.
  # manylinux: auto produces manylinux + musllinux on Linux runners.
  # ------------------------------------------------------------------
  wheels:
    name: ${{ matrix.platform.runner }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/arthash-py
          target: ${{ matrix.platform.target }}
          manylinux: auto
          # abi3 → one wheel per platform; pick a single interpreter to
          # build with (anything ≥ 3.9 works; we use 3.11 to match the
          # pyproject floor).
          args: --release --strip --out dist --interpreter python3.11

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: packages/arthash-py/dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/arthash-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packages/arthash-py/dist/*.tar.gz

  # ------------------------------------------------------------------
  # smoke-test the wheel installs and the binding loads. Python matrix
  # here verifies the abi3 wheel actually loads under each target Python.
  # ------------------------------------------------------------------
  test:
    name: test · ${{ matrix.runner }} · py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.runner }}-*
          merge-multiple: true
          path: dist
      - name: install wheel and run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist --only-binary arthash arthash pytest numpy pillow
          python -m pytest packages/arthash-py/tests/ -v

  # ------------------------------------------------------------------
  # release: only on a `py-v*` tag, after wheels + sdist + tests pass.
  # Uses PyPI Trusted Publishing (OIDC, no API token).
  # Set up at https://pypi.org/manage/project/arthash/settings/publishing/
  # (or "pending publisher" before first upload).
  # ------------------------------------------------------------------
  release:
    name: publish to PyPI
    needs: [version-check, wheels, sdist, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arthash/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: list artefacts
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Sigstore-sign every uploaded artefact (default in this action).
          # No `password:` — Trusted Publishing uses OIDC.
